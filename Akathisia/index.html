<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Akathisia</title>
<style type="text/css">
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#000; width:100%; height:100%; overflow:hidden; touch-action:none; }
#cv { display:block; position:fixed; top:0; left:0; width:100%; height:100%; }
#ov {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:#000; color:#444; font-family:"Courier Newhttps://andereth000.github.io/monospace;
  font-size:13px; line-height:2.4; padding:4em 2.4em; box-sizing:border-box;
}
#ov .num  { color:#1a1a1a; font-size:9px; margin-top:1.8em; letter-spacing:0.15em; }
#ov .end  { color:#151515; font-size:8px; margin-top:2.8em; letter-spacing:0.4em; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov">
  <p>The phone is cold.</p>
  <p>Something breathes on the other end.</p>
  <p>Scratched into the wall beside it:</p>
  <p class="num">+1 (___) ___-____</p>
  <p class="end">tap to hang up</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="text/javascript">


var ov = document.getElementById('ov');
var overlayOn = false;

// ---- Renderer ----
var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;

var scene  = new THREE.Scene();
scene.fog  = new THREE.FogExp2(0x000000, 0.09);

var camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.05, 40);
camera.position.set(0, 0.95, 6);

window.addEventListener('resize', function()
{
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---- Materials — all desaturated, dark ----
function mat(hex, rough)
{
  return new THREE.MeshStandardMaterial({
    color: hex,
    roughness: rough || 0.95,
    metalness: 0.0
  });
}

var mFloor   = mat(0x0c0c0c, 0.98);
var mWall    = mat(0x0f0f0f, 0.96);
var mCeiling = mat(0x080808, 0.99);
var mDoor    = mat(0x0a0a0a, 0.9);
var mDoorFrm = mat(0x161616, 0.85);
var mCouch   = mat(0x111111, 0.97);
var mCushion = mat(0x0d0d0d, 0.99);
var mPhone   = mat(0x141414, 0.8);
var mCord    = mat(0x0c0c0c, 0.99);
var mTable   = mat(0x0e0e0e, 0.95);
var mLeg     = mat(0x0b0b0b, 0.9);
var mWindow  = mat(0x111820, 0.3);  // slightly blue tint, less rough
var mBlind   = mat(0x0d0d0d, 0.99);
var mPill    = mat(0x1a1a1a, 0.6);

// ---- Room dimensions ----
var RW = 7.0;   // width
var RH = 2.6;   // height
var RL = 14.0;  // length (deep hallway/apartment)

// Floor
var floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RL), mFloor);
floor.rotation.x = -Math.PI/2;
floor.position.set(0, 0, 0);
floor.receiveShadow = true;
scene.add(floor);

// Ceiling
var ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW, RL), mCeiling);
ceil.rotation.x = Math.PI/2;
ceil.position.set(0, RH, 0);
scene.add(ceil);

// Walls — built from boxes so they have actual depth
function addWall(w, h, d, x, y, z, ry)
{
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mWall);
  m.position.set(x, y, z);
  if(ry){ m.rotation.y = ry; }
  m.receiveShadow = true;
  m.castShadow = true;
  scene.add(m);
  return m;
}

// Back wall
addWall(RW, RH, 0.12, 0, RH/2, -RL/2);
// Front wall
addWall(RW, RH, 0.12, 0, RH/2,  RL/2);
// Left wall
addWall(0.12, RH, RL, -RW/2, RH/2, 0);
// Right wall
addWall(0.12, RH, RL,  RW/2, RH/2, 0);

// Dividing wall with doorway — creates hallway feel
// Left section of divider
addWall(2.4, RH, 0.12, -2.3, RH/2, 1.0);
// Right section
addWall(2.4, RH, 0.12,  2.3, RH/2, 1.0);
// Header above doorway
addWall(1.2, 0.55, 0.12, 0, RH-0.275, 1.0);

// ---- Door frame + door ----
var doorW = 1.1; var doorH = 2.05;
// Frame sides
function addBox(w,h,d,x,y,z,mat2){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat2||mDoorFrm); m.position.set(x,y,z); m.castShadow=true; scene.add(m); return m; }
addBox(0.08, doorH+0.08, 0.14, -doorW/2-0.04, doorH/2, -RL/2+0.07);
addBox(0.08, doorH+0.08, 0.14,  doorW/2+0.04, doorH/2, -RL/2+0.07);
addBox(doorW+0.16, 0.08, 0.14, 0, doorH+0.04, -RL/2+0.07);
// Door panel
var door = addBox(doorW-0.05, doorH, 0.06, 0, doorH/2, -RL/2+0.1, mDoor);
// Door handle — sphere + rod
var handle = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), mat(0x222222, 0.5));
handle.position.set(0.38, doorH/2, -RL/2+0.14);
scene.add(handle);
var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.12, 8), mat(0x1e1e1e, 0.6));
rod.rotation.z = Math.PI/2;
rod.position.set(0.38, doorH/2, -RL/2+0.14);
scene.add(rod);

// ---- Couch ----
// Base
addBox(2.2, 0.42, 0.9,  1.8, 0.21, 4.5, mCouch);
// Back
addBox(2.2, 0.65, 0.14, 1.8, 0.63, 4.92, mCouch);
// Arms
addBox(0.14, 0.58, 0.9, 0.73, 0.39, 4.5, mCouch);
addBox(0.14, 0.58, 0.9, 2.87, 0.39, 4.5, mCouch);
// Cushions — 3 separate
addBox(0.66, 0.14, 0.78, 1.07, 0.48, 4.5, mCushion);
addBox(0.66, 0.14, 0.78, 1.80, 0.48, 4.5, mCushion);
addBox(0.66, 0.14, 0.78, 2.53, 0.48, 4.5, mCushion);

// ---- Coffee table ----
// Top
addBox(1.1, 0.06, 0.55, 1.8, 0.44, 3.4, mTable);
// Legs — 4
addBox(0.05,0.44,0.05, 1.3,  0.22, 3.17, mLeg);
addBox(0.05,0.44,0.05, 2.3,  0.22, 3.17, mLeg);
addBox(0.05,0.44,0.05, 1.3,  0.22, 3.63, mLeg);
addBox(0.05,0.44,0.05, 2.3,  0.22, 3.63, mLeg);

// Pill bottle on table
var bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.14, 10), mPill);
bottle.position.set(1.6, 0.54, 3.3);
scene.add(bottle);
var bottleCap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.03, 10), mat(0x1e1e1e, 0.5));
bottleCap.position.set(1.6, 0.625, 3.3);
scene.add(bottleCap);

// ---- Window — right wall ----
// Frame
addBox(0.08, 1.2, 0.12, RW/2-0.06, 1.4, 3.5, mDoorFrm);  // using wall pos
// Actually build as inset — recess in wall
var winFrame = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.05), mDoorFrm);
winFrame.position.set(RW/2-0.04, 1.4, 3.5);
scene.add(winFrame);
var winGlass = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.0), mWindow);
winGlass.rotation.y = Math.PI/2;
winGlass.position.set(RW/2-0.07, 1.4, 3.5);
scene.add(winGlass);
// Blind slats — 6
for(var bl=0;bl<6;bl++)
{
  var slat = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.03, 0.008), mBlind);
  slat.rotation.y = Math.PI/2;
  slat.position.set(RW/2-0.08, 0.98+bl*0.14, 3.5);
  scene.add(slat);
}

// ---- Phone on left wall ----
var phoneGroup = new THREE.Group();
// Body
var phoneBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.34, 0.1), mPhone);
phoneGroup.add(phoneBody);
// Receiver top
var recvTop = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.07), mat(0x0a0a0a, 0.85));
recvTop.position.set(0, 0.16, 0.04);
phoneGroup.add(recvTop);
// Receiver bottom
var recvBot = recvTop.clone();
recvBot.position.set(0, -0.16, 0.04);
phoneGroup.add(recvBot);
// Dial ring
var dialRing = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.012, 6, 12), mat(0x111111, 0.9));
dialRing.rotation.x = Math.PI/2;
dialRing.position.set(0, 0, 0.055);
phoneGroup.add(dialRing);
// Dial center
var dialCtr = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.01, 10), mat(0x0d0d0d, 0.95));
dialCtr.rotation.x = Math.PI/2;
dialCtr.position.set(0, 0, 0.06);
phoneGroup.add(dialCtr);
// Cord — segmented cylinder hanging down
for(var ci=0; ci<5; ci++)
{
  var cseg = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.1, 5), mCord);
  cseg.position.set(0.02*Math.sin(ci*0.8), -0.2-ci*0.1, 0.0);
  phoneGroup.add(cseg);
}
phoneGroup.position.set(-RW/2+0.12, 1.3, -1.2);
phoneGroup.rotation.y = Math.PI/2;
scene.add(phoneGroup);

// Scratched number on wall near phone
// (represented as slightly different wall patch)
var scratch = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.06), mat(0x131313, 0.99));
scratch.rotation.y = Math.PI/2;
scratch.position.set(-RW/2+0.07, 1.05, -1.2);
scene.add(scratch);

// ---- Hallway details ----
// Baseboard left
var bbl = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, RL), mat(0x0d0d0d, 0.99));
bbl.position.set(-RW/2+0.03, 0.06, 0);
scene.add(bbl);
// Baseboard right
var bbr = bbl.clone();
bbr.position.x = RW/2-0.03;
scene.add(bbr);

// Floor planks — thin boxes
for(var fp=-6; fp<8; fp++)
{
  var plank = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.003, 0.018), mat(0x0b0b0b, 1.0));
  plank.position.set(0, 0.001, fp*0.9);
  scene.add(plank);
}

// ---- Lighting ----
// Almost no ambient — oppressive darkness
var ambient = new THREE.AmbientLight(0xffffff, 0.04);
scene.add(ambient);

// Single overhead practical — flickers
var overhead = new THREE.PointLight(0xdde0e8, 0.7, 9);
overhead.position.set(0, 2.4, 2.0);
overhead.castShadow = true;
scene.add(overhead);

// Dim fill from door direction
var doorLight = new THREE.PointLight(0x8890a0, 0.2, 10);
doorLight.position.set(0, 1.6, -5.0);
scene.add(doorLight);

// Phone area — barely anything
var phoneLight = new THREE.PointLight(0x707880, 0.08, 3);
phoneLight.position.set(-RW/2+1.0, 1.3, -1.2);
scene.add(phoneLight);

// ---- Audio ----
var AC=null, masterGain=null;
function initAudio(){
  if(AC){return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain(); masterGain.gain.value=0.0; masterGain.connect(AC.destination);
    var o1=AC.createOscillator(); o1.type='sawtooth'; o1.frequency.value=28;
    var g1=AC.createGain(); g1.gain.value=0.35;
    var f1=AC.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=80;
    o1.connect(f1); f1.connect(g1); g1.connect(masterGain); o1.start();
    var o2a=AC.createOscillator(); o2a.type='sine'; o2a.frequency.value=55.0;
    var o2b=AC.createOscillator(); o2b.type='sine'; o2b.frequency.value=55.7;
    var g2=AC.createGain(); g2.gain.value=0.18;
    o2a.connect(g2); o2b.connect(g2); g2.connect(masterGain); o2a.start(); o2b.start();
    var o3=AC.createOscillator(); o3.type='sawtooth'; o3.frequency.value=180;
    var f3=AC.createBiquadFilter(); f3.type='bandpass'; f3.frequency.value=800; f3.Q.value=0.4;
    var g3=AC.createGain(); g3.gain.value=0.07;
    o3.connect(f3); f3.connect(g3); g3.connect(masterGain); o3.start();
    var lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.07;
    var lfoG=AC.createGain(); lfoG.gain.value=2.2;
    lfo.connect(lfoG); lfoG.connect(o2a.frequency); lfo.start();
    var br=AC.createOscillator(); br.type='sine'; br.frequency.value=0.18;
    var brAM=AC.createGain(); brAM.gain.value=0.0;
    var brO=AC.createOscillator(); brO.type='sine'; brO.frequency.value=220;
    br.connect(brAM.gain); brO.connect(brAM); brAM.connect(masterGain); br.start(); brO.start();
  }catch(e){}
}
function setVol(f){ if(!AC||!masterGain){return;} masterGain.gain.setTargetAtTime(f*0.5,AC.currentTime,0.8); }

document.addEventListener('touchstart',function(){ initAudio(); if(AC&&AC.state==='suspended'){AC.resume();} },{once:true,passive:true});
document.addEventListener('mousedown',function(){ initAudio(); if(AC&&AC.state==='suspended'){AC.resume();} },{once:true});

// ---- Player movement ----
var yaw=0, pitch=0;
var SPEED=0.055, TSPD=0.048;
var iF=false,iB=false,iL=false,iR=false;
var touches={};

window.addEventListener('touchstart',function(e){ e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];touches[t.identifier]={x:t.clientX,y:t.clientY};} },{passive:false});
window.addEventListener('touchmove',function(e){ e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(touches[t.identifier]){touches[t.identifier].x=t.clientX;touches[t.identifier].y=t.clientY;}} },{passive:false});
window.addEventListener('touchend',function(e){ e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++){delete touches[e.changedTouches[i].identifier];} },{passive:false});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'||e.key==='w'){iF=true;}
  if(e.key==='ArrowDown'||e.key==='s'){iB=true;}
  if(e.key==='ArrowLeft'||e.key==='a'){iL=true;}
  if(e.key==='ArrowRight'||e.key==='d'){iR=true;}
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowUp'||e.key==='w'){iF=false;}
  if(e.key==='ArrowDown'||e.key==='s'){iB=false;}
  if(e.key==='ArrowLeft'||e.key==='a'){iL=false;}
  if(e.key==='ArrowRight'||e.key==='d'){iR=false;}
});

ov.addEventListener('touchend',function(e){e.preventDefault();ov.style.display='none';overlayOn=false;setVol(0);},{passive:false});
ov.addEventListener('click',function(){ov.style.display='none';overlayOn=false;setVol(0);});

// Collision boxes (x min, x max, z min, z max)
var COLS = [
  // outer walls
  [-RW/2-0.1, -RW/2+0.25,  -RL/2-0.1,  RL/2+0.1],
  [ RW/2-0.25,  RW/2+0.1,  -RL/2-0.1,  RL/2+0.1],
  [-RW/2-0.1,  RW/2+0.1,  -RL/2-0.1, -RL/2+0.25],
  [-RW/2-0.1,  RW/2+0.1,   RL/2-0.25,  RL/2+0.1],
  // dividing wall left section
  [-RW/2,     -0.55,        0.88,       1.12],
  // dividing wall right section
  [ 0.55,      RW/2,        0.88,       1.12],
  // couch
  [ 0.7,       2.95,        4.05,       5.0 ],
  // coffee table
  [ 1.2,       2.4,         3.1,        3.72],
];

function collides(nx, nz)
{
  var r = 0.28;
  for(var i=0;i<COLS.length;i++)
  {
    var c=COLS[i];
    if(nx+r>c[0]&&nx-r<c[1]&&nz+r>c[2]&&nz-r<c[3]){ return true; }
  }
  return false;
}

function processTouch()
{
  iF=false;iB=false;iL=false;iR=false;
  var ids=Object.keys(touches);
  var W2=window.innerWidth; var H2=window.innerHeight;
  for(var i=0;i<ids.length;i++)
  {
    var t=touches[ids[i]];
    if(t.x<W2*0.3){iL=true;}
    else if(t.x>W2*0.7){iR=true;}
    else if(t.y<H2*0.5){iF=true;}
    else{iB=true;}
  }
}

// Light flicker state
var flickerTimer=0;
var flickerOn=true;
var flickerCooldown=0;

// Grain overlay canvas
var grainCv=document.createElement('canvas');
var grainCtx=grainCv.getContext('2d');

function update()
{
  if(overlayOn){return;}
  processTouch();

  if(iL){yaw+=TSPD;} if(iR){yaw-=TSPD;}

  var dx=0,dz=0;
  if(iF){dx+=Math.sin(yaw)*SPEED;dz+=Math.cos(yaw)*SPEED;}
  if(iB){dx-=Math.sin(yaw)*SPEED;dz-=Math.cos(yaw)*SPEED;}

  var nx=camera.position.x+dx;
  var nz=camera.position.z+dz;

  if(!collides(nx, camera.position.z)){camera.position.x=nx;}
  if(!collides(camera.position.x, nz)){camera.position.z=nz;}

  camera.rotation.set(0, yaw, 0, 'YXZ');

  // Phone proximity
  var pdx=camera.position.x-(-RW/2+0.5);
  var pdz=camera.position.z-(-1.2);
  var dist=Math.sqrt(pdx*pdx+pdz*pdz);
  var frac=Math.max(0,1.0-dist/8.0);
  setVol(frac*frac);
  if(!overlayOn&&dist<0.9){ overlayOn=true; ov.style.display='block'; setVol(0.7); }

  // Overhead light flicker — gets worse near phone
  flickerCooldown--;
  if(flickerCooldown<=0)
  {
    var flickerChance = 0.004 + frac*0.04;
    if(Math.random()<flickerChance)
    {
      flickerOn = !flickerOn;
      overhead.intensity = flickerOn ? 0.7 : 0.02;
      flickerCooldown = flickerOn ? Math.floor(Math.random()*8+2) : Math.floor(Math.random()*4+1);
    }
  }

  // Phone light pulses with audio
  phoneLight.intensity = 0.08 + frac*0.12*Math.sin(Date.now()*0.003);
}

function addGrain()
{
  var W2=window.innerWidth; var H2=window.innerHeight;
  grainCv.width=W2; grainCv.height=H2;
  var id=grainCtx.createImageData(W2,H2);
  var d=id.data;
  for(var i=0;i<d.length;i+=4)
  {
    var g=(Math.random()*16)|0;
    d[i]=g;d[i+1]=g;d[i+2]=g;d[i+3]=22;
  }
  grainCtx.putImageData(id,0,0);
  var ctx2=renderer.domElement.getContext('2d');
  if(ctx2){ctx2.drawImage(grainCv,0,0);}
}

function loop()
{
  update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();


</script>
</body>
</html>
